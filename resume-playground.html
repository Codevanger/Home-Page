<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Resume Playground</title>

    <!--
      Experiment freely: this file does not affect the PDF generator.
      Serve the project with Vite and open /resume-playground.html.
      Resume data: ./resume-source/resume.json
      Theme: jsonresume-theme-one-page-essential@0.2.0
    -->
    <link
      id="resume-overrides"
      rel="stylesheet"
      href="./styles/resume-playground.scss"
    />
  </head>
  <body>
    <p id="resume-loading">Loading resume…</p>
    <noscript>JavaScript is required to render this playground.</noscript>

    <script type="module">
      import { render } from 'https://esm.sh/jsonresume-theme-one-page-essential@0.2.0';

      try {
        const response = await fetch('./resume-source/resume.json');
        if (!response.ok)
          throw new Error(`Resume data: HTTP ${response.status}`);
        const resume = await response.json();
        const rendered = new DOMParser().parseFromString(
          render(resume),
          'text/html',
        );
        const overrides = document.getElementById('resume-overrides');
        rendered.head.append(rendered.importNode(overrides, true));
        document.replaceChild(
          document.importNode(rendered.documentElement, true),
          document.documentElement,
        );
      } catch (error) {
        document.getElementById('resume-loading').textContent =
          `Could not render the resume. Start Vite in the project and open ` +
          `http://localhost:5173/resume-playground.html — ${error.message}`;
      }
    </script>
  </body>
</html>
